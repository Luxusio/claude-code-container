- area: hyper-v-command-builders
  discovered: 2026-08-25
  notes: >
    hyperVDeleteCommand/hyperVRecoverOrphanCommand return { executable, args }
    where args[8] is a base64 utf16le PowerShell -EncodedCommand payload. To
    inspect the generated script: Buffer.from(args[args.length-1],'base64').toString('utf16le').
    Identity guards (src/host-control/hyper-v/core.ts:14-16) must be satisfied to
    render: OWNER_ID_PATTERN=^[a-f0-9]{16}$, DEVICE_ID_PATTERN=[A-Za-z0-9._:-]{1,128},
    INCARNATION_ID_PATTERN=^[a-f0-9]{32}$, and vmName MUST equal
    hyperVVmName(ownerId,deviceId,incarnationId). Valid test fixtures:
    ownerId=0123456789abcdef deviceId=windows-ci-01 incarnation=1111...(x32).
  commands:
    - "npm run test:hyper-v:static  # contracts PASS; pwsh parser SKIPs when PowerShell absent (exit 0)"
    - "npx vitest run src/__tests__/device-lab-hyper-v-provider.test.ts src/__tests__/device-lab-hyper-v-public-response.test.ts src/__tests__/device-lab-hyper-v-linux-broker.test.ts"
  env_notes: >
    No pwsh/Hyper-V in Linux container: native PowerShell parser SKIPs, and real
    VM delete/residue E2E is hardware-gated (Windows Hyper-V host / Windows CI only).

