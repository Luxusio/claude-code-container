name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Synchronize version from tag
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          case "$RELEASE_REF" in
            refs/tags/v*) VERSION="${RELEASE_REF#refs/tags/v}" ;;
            *) echo "Release requires a v-prefixed version tag ref" >&2; exit 1 ;;
          esac
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Release version cannot be used as a Docker tag" >&2; exit 1
          fi
          node scripts/set-release-version.mjs "$VERSION" || exit 1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/claude-code-container:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/claude-code-container:${{ steps.version.outputs.version }}
          labels: |
            cli.version=${{ steps.version.outputs.version }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm-publish:
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Synchronize version from tag
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          case "$RELEASE_REF" in
            refs/tags/v*) VERSION="${RELEASE_REF#refs/tags/v}" ;;
            *) echo "Release requires a v-prefixed version tag ref" >&2; exit 1 ;;
          esac
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Release version cannot be used as a Docker tag" >&2; exit 1
          fi
          node scripts/set-release-version.mjs "$VERSION" || exit 1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Determine npm tag
        id: npm-tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          LATEST=$(npm view claude-code-container version 2>/dev/null || echo "0.0.0")
          TAG=$(node scripts/determine-npm-tag.js "$RELEASE_VERSION" "$LATEST")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish
        run: npm publish --access public --provenance --tag ${{ steps.npm-tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ""

      - name: Commit version bump
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages/device-lab/package.json packages/hyper-v/package.json device-lab-mcp/package.json
          git diff --cached --quiet || git commit -m "chore: bump version to $RELEASE_VERSION"
          git push origin HEAD:master

  docker-test:
    runs-on: ubuntu-latest
    needs: docker-build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Synchronize version from tag
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          case "$RELEASE_REF" in
            refs/tags/v*) VERSION="${RELEASE_REF#refs/tags/v}" ;;
            *) echo "Release requires a v-prefixed version tag ref" >&2; exit 1 ;;
          esac
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Release version cannot be used as a Docker tag" >&2; exit 1
          fi
          node scripts/set-release-version.mjs "$VERSION" || exit 1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests inside ccc container
        run: |
          docker run --rm \
            -e MISE_TRUSTED_CONFIG_PATHS=/workspace \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ secrets.DOCKERHUB_USERNAME }}/claude-code-container:${{ steps.version.outputs.version }} \
            bash -c "npm run build && npx vitest run src/__tests__/chrome-devtools-integration.test.ts"
